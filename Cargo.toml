[package]
repository = "https://github.com/SuperInstance/character-encounter"
name = "character-encounter"
version = "0.1.0"
edition = "2021"
description = "RPG encounter engine — the runtime where character sheets (.nail bundles) come alive"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[dev-dependencies]
